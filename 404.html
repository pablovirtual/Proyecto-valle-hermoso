<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | Fraccionamiento Valle Hermoso</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23059669'/><path d='M50 22 L20 48 L28 48 L28 78 L42 78 L42 60 L58 60 L58 78 L72 78 L72 48 L80 48 Z' fill='white'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    // Redirigir automáticamente al portal principal tras 3 segundos
    let countdown = 3;
    const timer = setInterval(() => {
      countdown--;
      const el = document.getElementById('countdown-timer');
      if (el) el.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(timer);
        window.location.replace('./index.html');
      }
    }, 1000);
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-['Plus_Jakarta_Sans',sans-serif] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-xl border border-slate-200 text-center">
    <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
      <i class="fa-solid fa-tree-city"></i>
    </div>
    
    <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full mb-3 uppercase tracking-wider">
      Código 404 • Ruta no encontrada
    </span>
    
    <h1 class="text-2xl font-extrabold text-slate-900 mb-2">Fraccionamiento Valle Hermoso</h1>
    <p class="text-sm text-slate-500 mb-6 leading-relaxed">
      La dirección que intentas consultar no existe o ha sido reubicada. Serás redirigido al portal principal en <span id="countdown-timer" class="font-bold text-emerald-600">3</span> segundos.
    </p>

    <div class="flex flex-col sm:flex-row gap-3">
      <a href="./index.html" class="flex-1 py-3 px-5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition flex items-center justify-center gap-2 text-sm">
        <i class="fa-solid fa-house"></i>
        <span>Ir al Portal Principal</span>
      </a>
    </div>

    <div class="mt-6 pt-6 border-t border-slate-100 text-xs text-slate-400">
      Sistema Web de Pagos y Administración Vecinal
    </div>
  </div>
</body>
</html>
